name: Tests - Jest y JUnit 5

on:
  push:
    paths:
      - "modulo-3/practica/04-testing-jest-junit/**"
      - ".github/workflows/testing-jest-junit.yml"
  pull_request:
    paths:
      - "modulo-3/practica/04-testing-jest-junit/**"
      - ".github/workflows/testing-jest-junit.yml"
  workflow_dispatch:

jobs:
  jest:
    name: JavaScript - Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulo-3/practica/04-testing-jest-junit/javascript-jest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  junit:
    name: Java - JUnit 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -f modulo-3/practica/04-testing-jest-junit/java-junit/pom.xml test
